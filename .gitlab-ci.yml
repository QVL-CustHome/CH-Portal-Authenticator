# CI/CD CH-Portal-Authenticator — base commune : template node QVL-ToolBox/PipeLine
# Particularite : dependance npm "file:../CH-Portail-Admin". Le repo voisin est clone
# via les credentials stockees du runner (git-credentials), plus robuste que CI_JOB_TOKEN.
include:
  - remote: "https://raw.githubusercontent.com/QVL-ToolBox/PipeLine/main/node.gitlab-ci.yml"

stages:
  - test
  - build
  - deploy

default:
  before_script:
    - |
      if [ -d ../CH-Portail-Admin/.git ]; then
        git -C ../CH-Portail-Admin fetch --depth 1 origin main && git -C ../CH-Portail-Admin reset --hard origin/main
      else
        git clone --depth 1 https://gitlab.com/qvl-custhome/CH-Portail-Admin.git ../CH-Portail-Admin
      fi

lint:
  script:
    - npm ci
    - npm run lint

build:
  variables:
    VITE_TRUSTED_REDIRECT_ORIGINS: "https://ch-admin.qvl-project.com,https://ch-drive.qvl-project.com,https://ch-budgy.qvl-project.com"
  script:
    - npm ci
    - npm install canopui@latest # toujours la derniere CanopUI dans l'artefact deploye
    - npm run build
  artifacts:
    paths: [dist/]
    expire_in: 1 week

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  dependencies: [build]
  script:
    - sudo /usr/local/bin/ch-deploy-portal ch-portal-authenticator "$CI_PROJECT_DIR"

# auto-pull du clone local persistant sur /mnt/c (evite les checkouts perimes en local)
#
# Deux pieges corriges ici. D'abord `pull --ff-only origin main` avance la
# branche COURANTE : sur un clone reste sur une branche de travail, il faisait
# avancer celle-ci et laissait `main` gele, sans jamais le dire. Ensuite le fetch
# depend d'identifiants gitlab.com que le clone n'a pas forcement en cache, et
# l'echec passait inapercu. On se replace donc explicitement sur main, et on
# fetch avec le jeton du job.
update-checkout:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true
  dependencies: []
  variables:
    CLONE_LOCAL: /mnt/c/QVL/QVL-CustHome/CH-Portal-Authenticator
  script:
    - git -C "$CLONE_LOCAL" fetch "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" main
    - git -C "$CLONE_LOCAL" checkout main
    - git -C "$CLONE_LOCAL" merge --ff-only FETCH_HEAD
    - git -C "$CLONE_LOCAL" log --oneline -1
